databases:
  - name: westone-db
    plan: free
    databaseName: westone
    user: westone

services:
  - type: web
    name: westone-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: westone-db
          property: connectionString
      - key: PGSSL
        value: enable
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_COOKIE_NAME
        value: westone_session
      - key: FRONTEND_URL
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: ADMIN_DISCORD_IDS
        sync: false
